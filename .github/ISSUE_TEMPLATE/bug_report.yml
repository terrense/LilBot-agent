name: Bug report
description: Report a reproducible problem in LilBot
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please remove API keys,
        personal paths, and private repository content from logs before posting.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the observed behavior and why it is wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers the problem.
      placeholder: |
        1. Run `python -m lilbot --provider mock`
        2. Enter `...`
        3. Observe `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: LilBot version or commit
      placeholder: "0.2.0 / a941165"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and Python
      placeholder: "Windows 11, Python 3.13.5"
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: "deepseek / deepseek-chat, or mock"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or trace
      description: Paste the smallest useful excerpt. Redact secrets and private paths.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed API keys, tokens, and private data from the report.
          required: true
